{{define "content"}}
<div class="ideas-container">
  <div class="ideas-header">
    <div class="ideas-title-group">
      <h1>💡 pro-study 학습 및 기능 아이디어 제안소</h1>
      <span class="badge badge-accent">열린 제안</span>
    </div>
    <p class="ideas-subtitle">새로 배우고 싶은 프로그래밍 언어나 주제, 추가되었으면 하는 실전 프로젝트, 개선 아이디어를 자유롭게 제안해주세요. 누구나 추천(투표)할 수 있습니다.</p>
  </div>

  <div class="ideas-layout">
    <section class="idea-form-card">
      <h2>✨ 새로운 아이디어 제안하기</h2>
      <form id="ideaForm" class="idea-form">
        <div class="form-group">
          <label for="ideaTitle">아이디어 제목 <span class="req">*</span></label>
          <input type="text" id="ideaTitle" name="title" required placeholder="예: Rust 비동기 Tokio 채팅 서버 프로젝트 추가">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="ideaCategory">카테고리</label>
            <select id="ideaCategory" name="category">
              <option value="신규 프로젝트">신규 프로젝트</option>
              <option value="신규 언어">신규 언어 (Kotlin, C++, C#, 등)</option>
              <option value="기능 개선">학습 사이트 및 E-ink 앱 기능 개선</option>
              <option value="문법/필사 강좌">문법 레퍼런스 및 필사 강좌 추가</option>
              <option value="기타">기타 아이디어</option>
            </select>
          </div>

          <div class="form-group">
            <label for="ideaAuthor">작성자 (닉네임)</label>
            <input type="text" id="ideaAuthor" name="author" placeholder="익명 러너">
          </div>
        </div>

        <div class="form-group">
          <label for="ideaDesc">상세 설명</label>
          <textarea id="ideaDesc" name="description" rows="4" placeholder="어떤 기능이나 프로젝트인지, 왜 유용한지 구체적으로 적어주세요..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="btnSubmitIdea">
            <span>🚀 아이디어 등록하기</span>
          </button>
        </div>
      </form>
    </section>

    <section class="ideas-list-section">
      <div class="list-head">
        <h2>등록된 제안 목록 (<span id="ideasCount">{{len .Ideas}}</span>개)</h2>
        <div class="list-filter">
          <button class="filter-btn active" data-filter="all">전체</button>
          <button class="filter-btn" data-filter="신규 프로젝트">프로젝트</button>
          <button class="filter-btn" data-filter="신규 언어">언어</button>
          <button class="filter-btn" data-filter="기능 개선">기능 개선</button>
        </div>
      </div>

      <div class="ideas-cards" id="ideasList">
        {{range .Ideas}}
        <article class="idea-card" data-id="{{.ID}}" data-category="{{.Category}}">
          <div class="idea-vote-box">
            <button class="btn-vote" data-id="{{.ID}}" title="이 아이디어 추천하기">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
              <span class="vote-count">{{.Votes}}</span>
            </button>
          </div>
          <div class="idea-content">
            <div class="idea-meta">
              <span class="badge badge-idea-cat">{{.Category}}</span>
              <span class="idea-author">{{.Author}}</span>
              <span class="idea-date">{{.CreatedAt}}</span>
            </div>
            <h3 class="idea-card-title">{{.Title}}</h3>
            <p class="idea-card-desc">{{.Description}}</p>
          </div>
        </article>
        {{end}}
      </div>
    </section>
  </div>
</div>
{{end}}
