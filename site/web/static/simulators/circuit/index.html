<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>전자 회로 샌드박스 & 가상 오실로스코프 시뮬레이터 (Circuit Sandbox & Dual-Trace Oscilloscope)</title>
  <style>
    :root {
      --bg: #070d19;
      --card-bg: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 20px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .page-header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 20px;
    }
    .page-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }
    .sim-mount {
      width: 100%;
      max-width: 1200px;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1 class="page-title">⚡ 대화형 전자 회로 샌드박스 &amp; 2채널 가상 오실로스코프</h1>
    <p class="page-subtitle">
      Runge-Kutta 4차 수치해석 엔진 기반 회로 시뮬레이션: 전파 정류기+평활 필터, RLC 공진 필터, BJT 증폭기 및 클리핑, 연산 증폭기(가상 단락·슬루율), 555 발진기
    </p>
  </header>

  <main class="sim-mount" id="circuit-sandbox-container"></main>

  <script src="circuit-sandbox.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.circuitSim = CircuitSandboxSim.init('#circuit-sandbox-container', {
        initialCircuit: 'bridge_rectifier'
      });
    });
  </script>
</body>
</html>
